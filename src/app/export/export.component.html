<ul
  class="export"
  [ngClass]="{
    active: active,
    printable: printable,
    'loading-modal': printable
  }"
  tabindex="-1"
  appOpenerFocus
  [fnHide]="fnHide.bind(this)"
>
  <li class="printable-content">
    <ul>
      <li *ngIf="printable" class="logo">
        <span class="icon-wrapper">
          <img src="/assets/images/europeana-logo-white.png" class="icon" />
        </span>
        <h1>{{ getChartTitle() }}</h1>
      </li>
      <li *ngIf="printable">
        <img
          style="width: 100%; margin-top: 2rem; margin-bottom: 1rem"
          src="{{ imgDataUrl }}"
        />
      </li>
      <li>
        <app-grid
          #printableGrid
          [tierPrefix]="'tierPrefix'"
          facet="x"
          [isVisible]="printable"
        ></app-grid>
      </li>
    </ul>
  </li>
  <li class="container-h">
    <span class="export-icon"><a #downloadAnchor tabindex="-1"></a></span
    ><span class="label-top" i18n="Share Report Header@@exportReportHeader"
      >Share Report</span
    ><a
      #closer
      class="x"
      (click)="toggleActive()"
      (keydown.enter)="toggleActive()"
      [attr.tabindex]="tabIndex"
    ></a>
  </li>
  <li class="hr"></li>
  <li>
    <span i18n="Share Link Title@@exportReportLinkTitle">Share Link</span>
  </li>
  <li>
    <input
      #contentRef
      class="copy-source pad-top"
      readonly="readonly"
      [ngClass]="{ copied: copied }"
      value="{{ copied ? '' : currentUrl }}"
      i18n-placeholder="Copied message@@exportReportLinkCopiedMessage"
      placeholder="Copied to clipboard!"
      [attr.tabindex]="tabIndex"
    />
  </li>
  <li class="align-right hr">
    <a
      class="copy-btn"
      (click)="copy()"
      (keydown.enter)="copy()"
      [ngClass]="{ disabled: copied }"
      i18n="Copy Link Button@@exportReportLinkCopyButton"
      [attr.tabindex]="tabIndex"
      >Copy link</a
    >
  </li>
  <li>
    <span i18n="Share Data Title@@exportReportDataTitle">Export Data</span>
  </li>
  <li class="icon-item pad-top">
    <a
      class="container-h"
      (click)="export(ExportType.PNG)"
      (keydown.enter)="export(ExportType.PNG)"
      i18n="Download PNG@@exportReportDownloadPNG"
      [attr.tabindex]="tabIndex"
      ><span class="icon-png"></span>Download PNG</a
    >
  </li>
  <li class="icon-item pad-top">
    <a
      class="container-h"
      (click)="export(ExportType.PDF)"
      (keydown.enter)="export(ExportType.PDF)"
      i18n="Download PDF@@exportReportDownloadPDF"
      [attr.tabindex]="tabIndex"
      ><span class="icon-pdf"></span>Download PDF</a
    >
  </li>
  <li class="icon-item">
    <a
      class="container-h"
      (click)="export(ExportType.CSV)"
      (keydown.enter)="export(ExportType.CSV)"
      i18n="Download CSV@@exportReportDownloadCSV"
      [attr.tabindex]="tabIndex"
      ><span class="icon-csv"></span>Download CSV</a
    >
  </li>
</ul>
