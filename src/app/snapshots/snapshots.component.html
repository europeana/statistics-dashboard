@if (isVisible()) {
<ul class="comparison-list">
  @for (key of getSortKeys(); track key) { @if (compareData[key]; as item) { @if
  (item.saved || item.current || item.applied || key === '') {
  <li class="compare-data">
    <a
      class="compare-data-link"
      [class.applied]="item.applied || item.current"
      [class.current]="item.current"
      [attr.tabindex]="item.current ? -1 : 0"
      (keydown.enter)="toggle(key, item.current)"
      (click)="toggle(key, item.current)"
    >
      <span
        class="legend-square"
        [style.background-color]="
          item.applied || item.current
            ? colours[item._colourIndex]
            : 'transparent'
        "
      ></span>

      <span class="editable" contenteditable="false" spellcheck="false">
        {{ item.label }}
      </span>
    </a>

    <a
      class="save"
      [class.saved]="item.saved"
      aria-label="save (pin) item"
      [attr.tabindex]="0"
      (keydown.enter)="toggleSaved(key, item.current)"
      (click)="toggleSaved(key, item.current)"
    ></a>
  </li>
  } } }
</ul>
}
