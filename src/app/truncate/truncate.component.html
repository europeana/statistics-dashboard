<span class="text-outer" #container>
  <span class="text-left" #elRefTextLeft>
    <span [innerHTML]="textLeft | highlightMatch : [highlightText()]"></span>
  </span>

  <span
    class="text-right"
    #elRefTextRight
    [ngClass]="{ 'with-leading-space': applySpace }"
    [innerHTML]="textRight | highlightMatch : [highlightText()]"
  ></span>
</span>
