name: '- helper (image deployment)'
on: workflow_call
jobs:
  deploy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Get Env File
        uses: actions/download-artifact@master
        with:
          name: envFile
          path: env_file
      - run: |
          mv env_file/env_file deployment/${{ github.event.inputs.deploy_environment }}
      - run: |
          tag=${{ github.event.inputs.tag_name || 'develop' }}
          TAG_ESCAPED=${tag//[\/]/_}
          echo TAG_ESCAPED=${TAG_ESCAPED} >> $GITHUB_ENV
      - name: Inject Variables
        run: |
          export APP_IMAGE='europeana/statistics-dashboard:${{ env.TAG_ESCAPED }}'
          export MIN_REPLICAS='2'
          export MAX_REPLICAS='4'
          export UTILISATION_AVERAGE_PERCENT='75'
          envsubst < deployment/${{ github.event.inputs.deploy_environment }}/deployment.yaml | tee deployment/${{ github.event.inputs.deploy_environment }}/deployment.yaml
          envsubst < deployment/${{ github.event.inputs.deploy_environment }}/hpa.yaml | tee deployment/${{ github.event.inputs.deploy_environment }}/hpa.yaml
      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud --version
          ibmcloud config --check-version=false
          ibmcloud plugin install -f kubernetes-service
          ibmcloud plugin install -f container-registry
      - name: Login to IBM
        run: |
          ibmcloud login -a "${{ secrets.IBM_CLOUD_API_ENDPOINT}}" -r "${{ secrets.IBM_CLOUD_REGION}}" --apikey "${{ secrets.IBM_GEN_API_KEY }}"
          echo 'logged in to IBM'
      - name: Configure Cluster
        run: |
          K8s_CLUSTER_NAME=${{ secrets.IBM_CLOUD_K8S_CLUSTER_NAME }} && [[ ${{ github.event.inputs.deploy_environment }} == 'production' ]]  && K8s_CLUSTER_NAME=europeana
          ibmcloud ks cluster config --cluster $K8s_CLUSTER_NAME
          echo 'configured cluster'
          sleep 5
      - name: Push image
        run: |
          CTX_K8s=${{ secrets.TEST_K8S_CONTEXT }} && [[ ${{ github.event.inputs.deploy_environment }} == 'production' ]]  && CTX_K8s=${{ secrets.PRODUCTION_K8S_CONTEXT }}
          if ${{ github.event.inputs.delete }} == 'true'
          then
            kubectl --context $CTX_K8s delete -n ${{ github.event.inputs.deploy_environment }} -k deployment/${{ github.event.inputs.deploy_environment }}
          else
            kubectl --context $CTX_K8s apply -n ${{ github.event.inputs.deploy_environment }} -k deployment/${{ github.event.inputs.deploy_environment }}
          fi
