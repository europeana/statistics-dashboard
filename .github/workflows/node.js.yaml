name: '* Build & Deployment'
run-name: |
  ${{ github.event.inputs.delete == 'true'
    && 'deleting' || github.event.inputs.run_build == 'true'
    && 'building and deploying' || 'deploying' }}
    ${{ github.event.inputs.tag_name }}
    ${{ github.event.inputs.delete == 'true' && 'from' || 'to' }}
    ${{ github.event.inputs.deploy_environment }}
on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'target environment'
        required: true
        default: 'test'
        type: choice
        options:
        - test
        - acceptance
        - production
      tag_name:
        description: 'branch or tag to deploy'
        default: 'develop'
        type: string
      run_build:
        description: '(re)build docker image'
        default: false
        type: boolean
      delete:
        default: false
        type: boolean
jobs:
  make-env-file:
    uses: ./.github/workflows/env-file-generation.yaml
    with:
      deploy_environment: ${{ github.event.inputs.deploy_environment }}
    secrets: inherit

  run-e2e:
    if: ${{ github.event.inputs.run_build == 'true' }}
    name: 'e2e'
    uses: ./.github/workflows/run-tests-e2e.yaml
    with:
      tag_name: ${{ github.event.inputs.tag_name }}

  run-unit:
    if: ${{ github.event.inputs.run_build == 'true' }}
    name: 'tests'
    uses: ./.github/workflows/run-tests.yaml
    with:
      tag_name: ${{ github.event.inputs.tag_name }}
    secrets: inherit

  run-sonar:
    if: ${{ github.event.inputs.run_build == 'true' }}
    needs: [run-unit]
    uses: ./.github/workflows/run-sonar.yaml
    with:
      tag_name: ${{ github.event.inputs.tag_name }}
    secrets: inherit

  build-dist:
    if: ${{ github.event.inputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag_name }}
      - name: Build Artifact
        uses: actions/setup-node@v5
        with:
          node-version: '22.12'
          cache: 'npm'
      - run: npm install
      - run: npm run dist-localised
      - run: mv ./dist/statistics-dashboard/browser/* ./dist/statistics-dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist

  push-docker-image:
    needs: [build-dist, run-unit, run-e2e]
    if: ${{ github.event.inputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag_name }}
      - name: Get Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4.0.0

      - run: |
          tag=${{ github.event.inputs.tag_name || 'develop' }}
          TAG_ESCAPED=${tag//[\/]/_}
          echo TAG_ESCAPED=${TAG_ESCAPED} >> $GITHUB_ENV

      - name: Extract Metadata for Docker Image
        id: meta
        uses: docker/metadata-action@v6.0.0
        env:
          PROJECT_VERSION: ${{ secrets.PROJECT_VERSION }}
        with:
          images: europeana/statistics-dashboard
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ env.PROJECT_VERSION }}
            ${{ github.event.inputs.tag_name || 'develop' }}
            ${{ env.TAG_ESCAPED }}

      - name: Build and push
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  push-to-kubernetes:
    needs: [push-docker-image, make-env-file]
    if: |
      always() &&
      !cancelled() &&
      (needs.make-env-file.result == 'success') &&
      (needs.push-docker-image.result == 'success' || needs.push-docker-image.result == 'skipped')
    uses: ./.github/workflows/deploy-image.yaml
    secrets: inherit
